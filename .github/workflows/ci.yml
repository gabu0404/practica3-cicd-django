name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "ci-setup" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: 1. Integracion Continua (Tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas automatizadas (Tests)
        env:
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python manage.py test

  build-docker:
    name: 2. Construccion Docker y Artefacto (CD)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker del proyecto
        run: |
          docker build -t django-app-cicd:latest .

      - name: Exportar imagen Docker como archivo .tar
        run: |
          docker save django-app-cicd:latest -o django-app-image.tar

      - name: Guardar artefacto Docker en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-artifact
          path: django-app-image.tar
          retention-days: 5